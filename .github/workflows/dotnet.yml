name: Build and publish ProjectZ
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      desktopgl_only:
        description: Build only the Linux and macOS packages
        type: boolean
        default: false
      publish_desktopgl:
        description: Publish validated Linux and macOS packages to NuGet
        type: boolean
        default: false
      validate_only:
        description: Run the complete release checks without publishing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    if: ${{ inputs.desktopgl_only != true }}
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify linked CSharp and VB XAML conversion
        shell: pwsh
        run: ./tests/WpfImport/Verify.ps1 -SkipRuntime
      - name: Verify opt-in compile-time XAML on NET8 and NET10
        shell: pwsh
        run: ./tests/WpfImport/BuildTime/Verify.ps1 -SkipRuntime
      - name: Verify compiled vector curves and default font resolution
        shell: pwsh
        run: |
          dotnet run --project tests/CompiledVectorText/CompiledVectorText.csproj -c Release -p:GeneratePackageOnBuild=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/VectorFontsOnly/VectorFontsOnly.csproj -c Release -p:GeneratePackageOnBuild=false -p:UseLocalSocketJack=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native project rendering quality settings
        shell: pwsh
        run: ./tests/GraphicsQuality/Verify-ProjectSettings.ps1 -SkipRuntime
      - name: Verify native popup XAML and appearance export
        shell: pwsh
        run: |
          ./tests/NativeSceneXaml/Verify.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/NativeSceneExport/Verify.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build base runtime and optional co-packages
        shell: pwsh
        run: ./tools/Pack-RuntimePackages.ps1
      - name: Verify standalone base and optional package consumers
        shell: pwsh
        run: |
          [xml]$properties = Get-Content Extensions/ProjectZ.Package.props
          $version = $properties.Project.PropertyGroup.Version
          ./tests/Packaging/Verify.ps1 -PackagePath "artifacts/runtime-packages/ProjectZ.$version.nupkg"
      - name: Preserve packages for GitHub distribution
        uses: actions/upload-artifact@v4
        with:
          name: ProjectZ-runtime-packages
          path: artifacts/runtime-packages/*.nupkg
          if-no-files-found: error
  desktopgl:
    uses: ./.github/workflows/desktopgl.yml
  release:
    if: ${{ always() && !cancelled() && needs.desktopgl.result == 'success' && (needs.windows.result == 'success' || inputs.desktopgl_only == true) }}
    needs: [windows, desktopgl]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download Windows and optional runtime packages
        if: inputs.desktopgl_only != true
        uses: actions/download-artifact@v4
        with:
          name: ProjectZ-runtime-packages
          path: release-packages
      - name: Download native Linux package
        uses: actions/download-artifact@v4
        with:
          name: ProjectZ-Linux-release
          path: release-packages
      - name: Download universal macOS package
        uses: actions/download-artifact@v4
        with:
          name: ProjectZ-macOS-release
          path: release-packages
      - name: Verify complete versioned release set
        shell: pwsh
        env:
          DESKTOPGL_ONLY: ${{ inputs.desktopgl_only }}
        run: |
          ./tools/Verify-ReleasePackages.ps1 -Directory release-packages -DesktopGLOnly:($env:DESKTOPGL_ONLY -eq 'true') -ExpectedCommit '${{ github.sha }}'
      - name: Publish complete package set on GitHub
        if: inputs.validate_only != true && (inputs.desktopgl_only != true || inputs.publish_desktopgl == true)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$properties = Get-Content Extensions/ProjectZ.Package.props
          $version = $properties.Project.PropertyGroup.Version
          $tag = "v$version"
          $packages = @(Get-ChildItem release-packages/*.nupkg)
          $existing = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @($packages.FullName) --target '${{ github.sha }}' --title "ProjectZ $version" --notes-file docs/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $names = @((ConvertFrom-Json $existing).assets.name)
            $missing = @($packages | Where-Object Name -NotIn $names)
            if ($missing.Count -gt 0) {
              gh release upload $tag @($missing.FullName)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: NuGet Trusted Publishing
        if: inputs.validate_only != true && (inputs.desktopgl_only != true || inputs.publish_desktopgl == true)
        uses: NuGet/login@v1
        id: login
        with:
          user: Pathogenix
      - name: Push complete package set to NuGet
        if: inputs.validate_only != true && (inputs.desktopgl_only != true || inputs.publish_desktopgl == true)
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem release-packages/*.nupkg | Sort-Object @{Expression={ if ($_.Name -match '^ProjectZ\.\d') { 1 } else { 0 } }},Name)
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  templates:
    if: inputs.validate_only != true && inputs.desktopgl_only != true
    needs: release
    uses: ./.github/workflows/templates.yml
    permissions:
      contents: write
    with:
      publish: true
