name: Build and publish ProjectZ
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      desktopgl_only:
        description: Build only the Linux and macOS packages
        type: boolean
        default: false
      publish_desktopgl:
        description: Publish validated Linux and macOS packages to NuGet
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    if: ${{ inputs.desktopgl_only != true }}
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify linked CSharp and VB XAML conversion
        shell: pwsh
        run: ./tests/WpfImport/Verify.ps1 -SkipRuntime
      - name: Verify opt-in compile-time XAML on NET8 and NET10
        shell: pwsh
        run: ./tests/WpfImport/BuildTime/Verify.ps1 -SkipRuntime
      - name: Verify compiled vector curves and default font resolution
        shell: pwsh
        run: |
          dotnet run --project tests/CompiledVectorText/CompiledVectorText.csproj -c Release -p:GeneratePackageOnBuild=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/VectorFontsOnly/VectorFontsOnly.csproj -c Release -p:GeneratePackageOnBuild=false -p:UseLocalSocketJack=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native project rendering quality settings
        shell: pwsh
        run: ./tests/GraphicsQuality/Verify-ProjectSettings.ps1 -SkipRuntime
      - name: Verify native popup XAML and appearance export
        shell: pwsh
        run: |
          ./tests/NativeSceneXaml/Verify.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/NativeSceneExport/Verify.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build base runtime and optional co-packages
        shell: pwsh
        run: ./tools/Pack-RuntimePackages.ps1
      - name: Verify standalone base and optional package consumers
        shell: pwsh
        run: |
          [xml]$properties = Get-Content Extensions/ProjectZ.Package.props
          $version = $properties.Project.PropertyGroup.Version
          ./tests/Packaging/Verify.ps1 -PackagePath "artifacts/runtime-packages/ProjectZ.$version.nupkg"
      - name: Preserve packages for GitHub distribution
        uses: actions/upload-artifact@v4
        with:
          name: ProjectZ-runtime-packages
          path: artifacts/runtime-packages/*.nupkg
          if-no-files-found: error
      - name: Publish validated packages on GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$properties = Get-Content Extensions/ProjectZ.Package.props
          $version = $properties.Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag --json tagName 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $packages = @(Get-ChildItem artifacts/runtime-packages/*.nupkg | ForEach-Object FullName)
          if ($packages.Count -ne 5) { throw 'Expected the base runtime and four optional co-packages.' }
          gh release create $tag @packages --target '${{ github.sha }}' --title "ProjectZ $version" --notes-file docs/MODULAR-PACKAGES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: Pathogenix
      - name: Push base runtime and co-packages to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # Publish optional features before the new base version is discoverable.
          $packages = @(Get-ChildItem artifacts/runtime-packages/*.nupkg | Sort-Object @{Expression={ if ($_.Name -match '^ProjectZ\.\d') { 1 } else { 0 } }},Name)
          if ($packages.Count -ne 5) { throw 'Expected the base runtime and four optional co-packages.' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  desktopgl:
    if: ${{ github.event_name == 'push' || inputs.desktopgl_only == true || inputs.publish_desktopgl == true }}
    uses: ./.github/workflows/desktopgl.yml
  publish-desktopgl:
    if: ${{ github.event_name == 'push' || inputs.publish_desktopgl == true }}
    needs: desktopgl
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: ProjectZ-DesktopGL-linux-x64
          path: desktopgl-packages
      - name: NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: Pathogenix
      - name: Push Linux and macOS packages to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem desktopgl-packages/*.nupkg)
          if ($packages.Count -ne 2 -or @($packages | Where-Object Name -NotMatch '^ProjectZ\.(Linux|macOS)\.\d').Count -ne 0) {
            throw 'Expected exactly the validated Linux and macOS packages.'
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
